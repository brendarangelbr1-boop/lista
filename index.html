<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />

    <title>Compras da semana</title>
  </head>
  <body>
    <main>
      <header>
        <a href="#" class="back">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Voltar
        </a>
        <h1>Compras da semana</h1>
      </header>

      <form id="item-form" novalidate>
        <label for="item-input" class="sr-only">Novo item</label>
        <input
          type="text"
          id="item-input"
          name="item"
          placeholder="Adicione um novo item"
          autocomplete="off"
          required
        />
        <button type="submit">Adicionar item</button>
      </form>

      <ul id="item-list">
        <li class="item">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Pão de forma</span>
          </label>
          <button type="button" class="remove" aria-label="Remover Pão de forma">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>
          </button>
        </li>
        <li class="item">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Café preto</span>
          </label>
          <button type="button" class="remove" aria-label="Remover Café preto">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>
          </button>
        </li>
        <li class="item">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Suco de laranja</span>
          </label>
          <button type="button" class="remove" aria-label="Remover Suco de laranja">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>
          </button>
        </li>
        <li class="item">
          <label>
            <input type="checkbox" />
            <span class="box"></span>
            <span class="name">Bolacha</span>
          </label>
          <button type="button" class="remove" aria-label="Remover Bolacha">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>
          </button>
        </li>
      </ul>

      <p id="empty" class="empty">Sua lista está vazia. Adicione o primeiro item.</p>

      <div id="toast" class="toast" role="alert">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M12 7v6M12 16.5v.01" stroke="#c93b47" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span id="toast-text"></span>
        <button type="button" id="toast-close" aria-label="Fechar aviso">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </main>

    <script src="scripts.js"></script>
  </body>
</html>
